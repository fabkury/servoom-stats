name: diag
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    environment: polling
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - env:
          RAW_REPO_DEPLOY_KEY: ${{ secrets.RAW_REPO_DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$RAW_REPO_DEPLOY_KEY" > ~/.ssh/raw_key && chmod 600 ~/.ssh/raw_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/raw_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          python - <<'PY'
          import time, requests, collections
          H = "https://appin.divoom-gz.com"
          def body(k): return {"Classify": 1, "FileSize": 1, "FileType": 5, "FileSort": 0, "Version": 19, "RefreshIndex": 0, "StartNum": 1 + 30 * (k % 50), "EndNum": 30 + 30 * (k % 50)}
          s = requests.Session()
          def run(rps, seconds, workers=1):
              from concurrent.futures import ThreadPoolExecutor
              n = int(rps * seconds); t0 = time.time(); codes = [None] * n
              def one(k):
                  t = t0 + k / rps
                  if t > time.time(): time.sleep(t - time.time())
                  codes[k] = s.post(f"{H}/GetCategoryFileListV2", json=body(k), timeout=30).json().get("ReturnCode")
              with ThreadPoolExecutor(workers) as ex: list(ex.map(one, range(n)))
              first = next((i for i, c in enumerate(codes) if c == 12), None)
              print(f"{rps} rps x {seconds}s, {workers} workers: {dict(collections.Counter(codes))} first 12 at #{first} ({time.time()-t0:.0f}s)", flush=True)
          for rps, sec in [(2, 60), (3, 60), (4, 60), (5, 60), (8, 40)]:
              time.sleep(25); run(rps, sec, workers=4)
          time.sleep(25); run(3, 120, workers=4)
          PY
