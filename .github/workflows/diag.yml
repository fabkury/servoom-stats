name: diag
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    environment: polling
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - env:
          RAW_REPO_DEPLOY_KEY: ${{ secrets.RAW_REPO_DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$RAW_REPO_DEPLOY_KEY" > ~/.ssh/raw_key && chmod 600 ~/.ssh/raw_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/raw_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          python - <<'PY'
          import json, time
          from concurrent.futures import ThreadPoolExecutor
          from stats import rawrepo
          from stats.api import Api, HOST
          main = rawrepo.clone_main(["state"])
          a = json.loads((main / "state/accounts/pulse-01.json").read_text())
          print("::add-mask::" + str(a["token"])); print("::add-mask::" + str(a["md5"]))
          api = Api(rps=6, workers=4)
          def lp(auth, c, size, start, refresh=True):
              api.auth = {"Token": a["token"], "UserId": a["user_id"]} if auth else {}
              b = {"Classify": c, "FileSize": size, "FileType": 5, "FileSort": 0, "Version": 19, "StartNum": start, "EndNum": start + 29}
              if refresh: b["RefreshIndex"] = 0
              d = api.post("GetCategoryFileListV2", b)
              return d.get("ReturnCode"), d.get("ReturnMessage"), len(d.get("FileList") or []), d.get("FileListNum")
          print("authed canary 3001 no-refresh ", lp(True, 1, 1, 3001, refresh=False))
          print("authed cls1 s1 page1 refresh   ", lp(True, 1, 1, 1))
          print("authed cls1 s1 page1 no-refresh", lp(True, 1, 1, 1, refresh=False))
          print("anon   cls1 s1 page1 refresh   ", lp(False, 1, 1, 1))
          print("authed cls16 s1 page1          ", lp(True, 16, 1, 1))
          print("authed cls1 s1 start 61        ", lp(True, 1, 1, 61))
          api.auth = {"Token": a["token"], "UserId": a["user_id"]}
          with ThreadPoolExecutor(4) as ex:
              res = list(ex.map(lambda k: lp(True, 1, 1, 1 + 30 * k), range(8)))
          print("authed wave of 8:", [r[0] for r in res])
          print("authed canary again            ", lp(True, 1, 1, 3001, refresh=False))
          print("GetLikeUserList", api.post("Cloud/GetLikeUserList", {"GalleryId": 1, "StartNum": 1, "EndNum": 1}).get("ReturnCode"))
          PY
