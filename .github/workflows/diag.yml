name: diag
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    environment: polling
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - env:
          RAW_REPO_DEPLOY_KEY: ${{ secrets.RAW_REPO_DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$RAW_REPO_DEPLOY_KEY" > ~/.ssh/raw_key && chmod 600 ~/.ssh/raw_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/raw_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          python - <<'PY'
          import json, time
          from stats import rawrepo
          from stats.api import Api, ApiDown
          main = rawrepo.clone_main(["state"])
          a = json.loads((main / "state/accounts/pulse-01.json").read_text())
          print("::add-mask::" + str(a["token"])); print("::add-mask::" + str(a["md5"]))
          api = Api(rps=6, workers=4)
          api.auth = {"Token": a["token"], "UserId": a["user_id"]}
          orig = api.post
          log = []
          def post(cmd, body=None, auth=True):
              d = orig(cmd, body, auth)
              code = d.get("ReturnCode")
              log.append((body.get("Classify"), body.get("FileSize"), body.get("StartNum"), code, len(d.get("FileList") or [])))
              if code not in (0, 1):
                  print("NON-ZERO:", cmd, {k: v for k, v in body.items()}, "->", code, d.get("ReturnMessage"), "n_requests", api.n_requests)
              return d
          api.post = post
          cutoff = int(time.time()) - 30 * 86400
          from stats.util import CATEGORIES, ALL_SIZES
          try:
              for cls in CATEGORIES:
                  for size in ALL_SIZES:
                      fl = api.crawl_list(cls, size, stop_before=cutoff, old_streak=2)
                      print("list", cls, size, "ok pages", len([x for x in log if x[0] == cls and x[1] == size]), "items", len(fl), "n_requests", api.n_requests)
                      if api.n_requests > 400: break
                  if api.n_requests > 400: break
          except ApiDown as exc:
              print("APIDOWN:", exc, "after", api.n_requests, "requests")
              print("last 12 pages:", log[-12:])
          PY
