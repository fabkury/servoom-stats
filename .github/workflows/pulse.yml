name: pulse

# Two jobs, one after the other, each on its own runner and so with its own budget of
# 30 requests a minute: `pulse` reads the 30-day window for 44 minutes; `refresh`
# (stats/refresh.py) then reads the id walk, new comments and a sample of new accounts
# until 2.5 minutes before the next pulse, and every 4 hours rebuilds data/pulse/.
# They never overlap, so sharing an egress address or an account cannot cost refusals.

on:
  schedule:
    # Fallback only: a Cloudflare Worker starts this workflow at :17 every hour (worker/).
    # GitHub's own schedule is often late or dropped; a run within 50 minutes of the
    # previous pulse exits at once. One fallback an hour: a pulse now takes most of it.
    - cron: '47 * * * *'
  workflow_dispatch:
    inputs:
      refresh:
        description: 'Rebuild data/pulse at once, whether or not 4 hours have passed'
        type: boolean
        default: false

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: 1
  ACCOUNT_EMAIL_DOMAIN: ${{ vars.ACCOUNT_EMAIL_DOMAIN }}

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 56
    environment: polling
    concurrency:
      group: pulse
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Poll
        env:
          RAW_REPO_DEPLOY_KEY: ${{ secrets.RAW_REPO_DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$RAW_REPO_DEPLOY_KEY" > ~/.ssh/raw_key && chmod 600 ~/.ssh/raw_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/raw_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          python -m stats.pulse
      - name: Open issues
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/issues.sh

  refresh:
    needs: pulse
    # Runs after the pulse whatever its outcome (a failed pulse must not leave the site
    # stale), but not when the whole run was cancelled.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: polling
    concurrency:
      group: refresh
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Walk, poll and rebuild
        env:
          RAW_REPO_DEPLOY_KEY: ${{ secrets.RAW_REPO_DEPLOY_KEY }}
          FORCE_REFRESH: ${{ inputs.refresh && '1' || '' }}
          PULSE_MINUTE: 17
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$RAW_REPO_DEPLOY_KEY" > ~/.ssh/raw_key && chmod 600 ~/.ssh/raw_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/raw_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          python -m stats.refresh
      - name: Publish data
        id: publish
        run: bash scripts/publish.sh "pulse"
      - name: Trigger site build
        if: steps.publish.outputs.changed == 'true'
        env:
          CF_DEPLOY_HOOK_URL: ${{ secrets.CF_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$CF_DEPLOY_HOOK_URL" ]; then curl -fsS -X POST "$CF_DEPLOY_HOOK_URL" -o /dev/null && echo "site build requested"; else echo "no deploy hook configured"; fi
      - name: Open issues
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/issues.sh
