name: graph

# Daily artist graph (communities, map, flows, top-artist neighbourhoods) from the like
# log. Makes no Divoom request. Runs after the snapshot, or on its own at 09:27 UTC.
on:
  workflow_run:
    workflows: [snapshot]
    types: [completed]
  schedule:
    - cron: '27 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: graph
  cancel-in-progress: false

jobs:
  graph:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: polling
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -q -r requirements.txt -r requirements-graph.txt
      - name: Build the graph
        env:
          RAW_REPO_DEPLOY_KEY: ${{ secrets.RAW_REPO_DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$RAW_REPO_DEPLOY_KEY" > ~/.ssh/raw_key && chmod 600 ~/.ssh/raw_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/raw_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          python -m stats.graph
      - name: Publish data
        run: bash scripts/publish.sh "graph"
