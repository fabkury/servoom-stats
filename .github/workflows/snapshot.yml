name: snapshot

on:
  schedule:
    # Fallback only: a Cloudflare Worker starts this workflow at 05:43 UTC (worker/).
    # The catalog is read every two days: a run within 36 hours of the previous
    # snapshot exits at once (SNAPSHOT_MIN_GAP_HOURS in stats/snapshot.py).
    - cron: '13 7,9,11 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    environment: polling
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -q -r requirements.txt -r requirements-snapshot.txt
      - name: Check the decoders import
        run: python -c "from servoom import PixelBeanDecoder; print('decoders ok')"
      - name: Poll
        env:
          RAW_REPO_DEPLOY_KEY: ${{ secrets.RAW_REPO_DEPLOY_KEY }}
          ACCOUNT_EMAIL_DOMAIN: ${{ vars.ACCOUNT_EMAIL_DOMAIN }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$RAW_REPO_DEPLOY_KEY" > ~/.ssh/raw_key && chmod 600 ~/.ssh/raw_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/raw_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          python -m stats.snapshot
      - name: Publish data
        id: publish
        run: bash scripts/publish.sh "snapshot"
      - name: Trigger site build
        if: steps.publish.outputs.changed == 'true'
        env:
          CF_DEPLOY_HOOK_URL: ${{ secrets.CF_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$CF_DEPLOY_HOOK_URL" ]; then curl -fsS -X POST "$CF_DEPLOY_HOOK_URL" -o /dev/null && echo "site build requested"; else echo "no deploy hook configured"; fi
      - name: Open issues
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/issues.sh
